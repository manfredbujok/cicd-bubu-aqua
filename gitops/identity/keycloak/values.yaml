replicaCount: 1

image:
  repository: quay.io/keycloak/keycloak
  tag: "26.4.0"
  pullPolicy: IfNotPresent

keycloak:
  hostname: "https://auth.taiiku.tech"
  httpEnabled: true
  proxyHeaders: xforwarded

  admin:
    username: admin
    existingSecret: keycloak-admin
    passwordSecretKey: password

database:
  vendor: postgres
  host: keycloak-postgresql.identity.svc.cluster.local
  port: 5432
  name: keycloak
  username: keycloak
  existingSecret: keycloak-postgresql
  passwordSecretKey: password

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi