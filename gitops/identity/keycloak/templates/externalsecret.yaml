
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-admin
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: vault-identity
    kind: SecretStore

  target:
    name: keycloak-admin
    creationPolicy: Owner

  data:
    - secretKey: password
      remoteRef:
        key: identity/keycloak-admin
        property: password
