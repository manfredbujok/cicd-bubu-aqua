apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-api
  namespace: bubu-aqua-dev
spec:
  replicas: 1

  selector:
    matchLabels:
      app: control-api

  template:
    metadata:
      labels:
        app: control-api

    spec:
      containers:
        - name: control-api
          image: localhost:5000/control-api:1.0.0

          env:
            - name: CF_ACCESS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: control-api-cloudflare
                  key: CF_ACCESS_CLIENT_ID

            - name: CF_ACCESS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: control-api-cloudflare
                  key: CF_ACCESS_CLIENT_SECRET

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15