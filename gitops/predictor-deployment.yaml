apiVersion: apps/v1
kind: Deployment
metadata:
  name: dim-image-predictor
  namespace: bubu-aqua-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dim-image-predictor
  template:
    metadata:
      labels:
        app: dim-image-predictor
    spec:
      containers:
        - name: dim-image-predictor
          image: docker.io/taiiku/dim-image-predictor:0.4.8
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 3Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20