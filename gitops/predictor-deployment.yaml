
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dim-image-predictor
  namespace: bubu-aqua-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dim-image-predictor
  template:
    metadata:
      labels:
        app: dim-image-predictor
    spec:
      containers:
        - name: dim-image-predictor
          image: docker.io/taiiku/dim-image-predictor:0.4.8
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 3Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20

        - name: auth-proxy
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /app/proxy.py
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: auth-config
              mountPath: /app
              readOnly: true
            - name: predictor-token
              mountPath: /run/secrets/predictor
              readOnly: true

      volumes:
        - name: auth-config
          configMap:
            name: predictor-auth
        - name: predictor-token
          secret:
            secretName: predictor-api-token
