apiVersion: apps/v1
kind: Deployment
metadata:
  name: bubu-aqua
  namespace: bubu-aqua-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bubu-aqua
  template:
    metadata:
      labels:
        app: bubu-aqua
    spec:
      containers:
        - name: bubu-aqua
          image: localhost:5000/bubu-aqua:9e851283d364630ed6b12c8200e012eb28d4c919
          ports:
            - containerPort: 80
