apiVersion: apps/v1
kind: Deployment
metadata:
  name: bubu-aqua
  namespace: bubu-aqua-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bubu-aqua
  template:
    metadata:
      labels:
        app: bubu-aqua
    spec:
      containers:
        - name: bubu-aqua
          image: localhost:5000/bubu-aqua:761939f322ebe3ef62209cd12065bc615363c000
          ports:
            - containerPort: 80
