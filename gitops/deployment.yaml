apiVersion: apps/v1
kind: Deployment
metadata:
  name: bubu-aqua
  namespace: bubu-aqua-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bubu-aqua
  template:
    metadata:
      labels:
        app: bubu-aqua
    spec:
      containers:
        - name: bubu-aqua
          image: localhost:5000/bubu-aqua:8432f06757f1af32d0571b6c8ad3f092cfe99bd0
          ports:
            - containerPort: 80
