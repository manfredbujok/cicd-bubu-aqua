apiVersion: apps/v1
kind: Deployment
metadata:
  name: bubu-aqua
  namespace: bubu-aqua-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bubu-aqua
  template:
    metadata:
      labels:
        app: bubu-aqua
    spec:
      containers:
        - name: bubu-aqua
          image: localhost:5000/bubu-aqua:1269f80a24f9268a679901681f20bbbf9a090482
          ports:
            - containerPort: 80
