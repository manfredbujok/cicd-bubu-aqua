apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: control-api-cloudflare
  namespace: bubu-aqua-dev
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: vault-control-api
    kind: SecretStore

  target:
    name: control-api-cloudflare
    creationPolicy: Owner

  data:
    - secretKey: CF_ACCESS_CLIENT_ID
      remoteRef:
        key: control-api
        property: client-id

    - secretKey: CF_ACCESS_CLIENT_SECRET
      remoteRef:
        key: control-api
        property: client-secret