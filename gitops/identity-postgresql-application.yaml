
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: identity-postgresql
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/manfredbujok/cicd-bubu-aqua.git
    targetRevision: main
    path: gitops/identity/postgresql
    helm:
      releaseName: keycloak-postgresql
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: identity

  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
