apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: predictor-api-token
  namespace: bubu-aqua-dev
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: vault-predictor
    kind: SecretStore

  target:
    name: predictor-api-token
    creationPolicy: Owner

  data:
    - secretKey: API_TOKEN
      remoteRef:
        key: predictor
        property: api-token