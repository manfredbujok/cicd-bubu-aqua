{{- if .Values.nodes.edge.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: selenium-edge
spec:
  replicas: {{ .Values.nodes.edge.replicas }}
  selector:
    matchLabels:
      app: selenium-edge
  template:
    metadata:
      labels:
        app: selenium-edge
    spec:
      containers:
        - name: edge
          image: "{{ .Values.nodes.edge.image.repository }}:{{ .Values.nodes.edge.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}

          env:
            - name: SE_EVENT_BUS_HOST
              value: {{ .Values.hub.name | quote }}
            - name: SE_EVENT_BUS_PUBLISH_PORT
              value: "{{ .Values.hub.service.publishPort }}"
            - name: SE_EVENT_BUS_SUBSCRIBE_PORT
              value: "{{ .Values.hub.service.subscribePort }}"
            - name: SE_NODE_MAX_SESSIONS
              value: "{{ .Values.selenium.maxSessions }}"
            - name: SE_NODE_SESSION_TIMEOUT
              value: "{{ .Values.selenium.sessionTimeout }}"
            - name: SE_NODE_OVERRIDE_MAX_SESSIONS
              value: "false"

          ports:
            - name: webdriver
              containerPort: 5555

          volumeMounts:
            - name: dshm
              mountPath: /dev/shm

          readinessProbe:
            httpGet:
              path: /status
              port: webdriver
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /status
              port: webdriver
            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            {{- toYaml .Values.nodes.edge.resources | nindent 12 }}

      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.selenium.shmSize }}
{{- end }}
