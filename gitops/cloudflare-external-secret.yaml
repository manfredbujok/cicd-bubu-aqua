apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-token
  namespace: cloudflare
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: vault-cloudflare
    kind: SecretStore

  target:
    name: cloudflared-token
    creationPolicy: Owner

  data:
    - secretKey: TUNNEL_TOKEN
      remoteRef:
        key: cloudflare
        property: tunnel-token