apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-cloudflare
  namespace: cloudflare
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "cloudflare"
          serviceAccountRef:
            name: "vault-auth"