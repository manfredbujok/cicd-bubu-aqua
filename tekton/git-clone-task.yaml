apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone-bubu-aqua
  namespace: cicd-bubu-aqua
spec:
  params:
    - name: url
      type: string
  workspaces:
    - name: source
  steps:
    - name: clone
      image: alpine/git:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu

        echo "================================"
        echo " BUBU & AQUA - GIT CLONE 📦"
        echo "================================"

        git clone "$(params.url)" .

        echo ""
        echo "Repository cloned successfully:"
        git log -1 --oneline

        echo ""
        echo "Repository content:"
        ls -la
