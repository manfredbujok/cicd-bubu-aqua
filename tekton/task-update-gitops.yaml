apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: update-gitops
  namespace: cicd-bubu-aqua

spec:
  params:
    - name: git-revision
      type: string

    - name: gitops-repo-url
      type: string

    - name: deployment-file
      type: string
      default: gitops/deployment.yaml

    - name: image
      type: string
      default: localhost:5000/bubu-aqua

  steps:
    - name: update-and-push
      image: alpine/git:latest

      env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-credentials
              key: token

      script: |
        #!/bin/sh
        set -eu

        echo "================================"
        echo " BUBU & AQUA - UPDATE GITOPS 🚀"
        echo "================================"

        SHA="$(params.git-revision)"
        GITOPS_REPO="$(params.gitops-repo-url)"
        
        DEPLOYMENT_FILE="$(params.deployment-file)"
        IMAGE="$(params.image)"

        echo "New image tag: ${SHA}"
        echo "GitOps repository: ${GITOPS_REPO}"

        rm -rf /tmp/gitops

        echo ""
        echo "Cloning GitOps repository..."

        git clone "${GITOPS_REPO}" /tmp/gitops

        cd /tmp/gitops

        echo ""
        echo "Updating deployment..."

        test -f "$DEPLOYMENT_FILE" || {
          echo "ERROR: Deployment file not found: $DEPLOYMENT_FILE"
          exit 1
        }
      
        echo "Checking target image..."
      
        IMAGE_COUNT=$(grep -Fc "image: ${IMAGE}:" "$DEPLOYMENT_FILE" || true)
        
        if [ "$IMAGE_COUNT" -ne 1 ]; then
          echo "ERROR: Expected exactly one image for ${IMAGE}, found ${IMAGE_COUNT}"
          exit 1
        fi
        
        sed -i \
          "s#image: ${IMAGE}:.*#image: ${IMAGE}:${SHA}#" \
          "$DEPLOYMENT_FILE"

        echo "Updated deployment:"
        grep "image:" "$DEPLOYMENT_FILE"
        
        git config user.name "Bubu Aqua CI"
        git config user.email "bubu-aqua-ci@localhost"
        
        git add "$DEPLOYMENT_FILE"

        if git diff --cached --quiet; then
          echo "No GitOps change necessary."
          exit 0
        fi

        git commit -m "Deploy ${SHA} [skip ci]"

        cat > /tmp/git-askpass.sh <<'EOF'
        #!/bin/sh
        case "$1" in
          *Username*) echo "x-access-token" ;;
          *Password*) echo "$GITHUB_TOKEN" ;;
        esac
        EOF

        chmod 700 /tmp/git-askpass.sh

        export GIT_ASKPASS=/tmp/git-askpass.sh
        export GIT_TERMINAL_PROMPT=0

        git push origin HEAD:main

        echo ""
        echo "GitOps update pushed successfully. 🚀"