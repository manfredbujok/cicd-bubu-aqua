apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: verify-bubu-aqua
  namespace: cicd-bubu-aqua

spec:
  workspaces:
    - name: source

  steps:
    - name: verify
      image: alpine:3.22
      workingDir: $(workspaces.source.path)

      script: |
        #!/bin/sh
        set -eu

        echo "================================"
        echo " BUBU & AQUA - APP VERIFY 🔍"
        echo "================================"

        echo "Workspace:"
        pwd

        echo ""
        echo "Application repository:"
        ls -la

        echo ""
        echo "Checking required application files..."

        test -f Dockerfile
        echo "✓ Dockerfile"

        test -f index.html
        echo "✓ index.html"

        echo ""
        echo "Bubu & Aqua application verification passed 🚀"