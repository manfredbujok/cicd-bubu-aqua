apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: verify-bubu-aqua
  namespace: cicd-bubu-aqua
spec:
  workspaces:
    - name: source

  steps:
    - name: verify
      image: alpine:3.22
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu

        echo "================================"
        echo " BUBU & AQUA - VERIFY 🔍"
        echo "================================"

        echo "Workspace:"
        pwd

        echo ""
        echo "Repository:"
        ls -la

        echo ""
        echo "GitOps manifests:"
        ls -la gitops

        echo ""
        echo "Checking required files..."

        test -f gitops/deployment.yaml
        echo "✓ deployment.yaml"

        test -f gitops/service.yaml
        echo "✓ service.yaml"

        test -f README.md
        echo "✓ README.md"

        echo ""
        echo "Bubu & Aqua source verification passed 🚀"
