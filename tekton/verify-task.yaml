apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: verify-bubu-aqua
  namespace: cicd-bubu-aqua

spec:
  params:
    - name: app-path
      type: string
      default: .

  workspaces:
    - name: source

  steps:
    - name: verify
      image: alpine:3.22
      workingDir: $(workspaces.source.path)

      env:
        - name: APP_PATH
          value: $(params.app-path)

      script: |
        #!/bin/sh
        set -eu

        echo "================================"
        echo " BUBU & AQUA - APP VERIFY 🔍"
        echo "================================"

        cd "$APP_PATH"

        echo "Application directory:"
        pwd

        echo ""
        echo "Checking required files..."

        test -f Dockerfile
        echo "✓ Dockerfile"

        if [ -f pom.xml ]; then
          echo "✓ Spring Boot project"

          test -d src/main
          echo "✓ src/main"

        elif [ -f index.html ]; then
          echo "✓ HTML application"

        else
          echo "ERROR: Unknown application structure"
          exit 1
        fi

        echo ""
        echo "Application verification passed 🚀"