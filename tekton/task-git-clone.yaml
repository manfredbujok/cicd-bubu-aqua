apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone-bubu-aqua
  namespace: cicd-bubu-aqua

spec:
  params:
    - name: url
      type: string

    - name: revision
      type: string

  workspaces:
    - name: source

  steps:
    - name: clone
      image: alpine/git:latest
      workingDir: $(workspaces.source.path)

      script: |
        #!/bin/sh
        set -eu

        echo "================================"
        echo " BUBU & AQUA - GIT CLONE 📦"
        echo "================================"

        echo "Cleaning workspace..."
        rm -rf ./* ./.??* 2>/dev/null || true

        echo "Cloning $(params.url)..."
        git clone "$(params.url)" .

        echo ""
        echo "Checking out commit:"
        echo "$(params.revision)"

        git checkout "$(params.revision)"

        echo ""
        echo "Actually checked out:"
        git rev-parse HEAD

        echo ""
        echo "Commit:"
        git log -1 --oneline

        echo ""
        echo "Repository:"
        ls -la