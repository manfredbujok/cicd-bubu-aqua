apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: bubu-aqua-listener
  namespace: cicd-bubu-aqua
spec:
  serviceAccountName: bubu-aqua-trigger-sa

  triggers:
    - name: github-push

      interceptors:
        - ref:
            name: cel
          params:
            - name: filter
              value: >-
                header.match('X-GitHub-Event', 'push') &&
                !body.head_commit.message.contains('[skip ci]')

      bindings:
        - ref: bubu-aqua-binding

      template:
        ref: bubu-aqua-template
