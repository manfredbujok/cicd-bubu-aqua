apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: bubu-aqua-ci
  namespace: cicd-bubu-aqua
spec:
  params:
    - name: repo-url
      type: string
    - name: image
      type: string
    - name: git-revision
      type: string
    - name: dockerfile
      type: string
      default: Dockerfile
    - name: build-context
      type: string
      default: .
    - name: app-path
      type: string
      default: .
    - name: deployment-file
      type: string
      default: gitops/deployment.yaml
    - name: image-repository
      type: string
      default: localhost:5000/bubu-aqua

  workspaces:
    - name: shared-workspace

  tasks:
    - name: clone
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.git-revision)
      taskRef:
        name: git-clone-bubu-aqua
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: hello
      runAfter:
        - clone
      taskRef:
        name: hello-bubu-aqua

    - name: verify
      runAfter:
        - hello
      taskRef:
        name: verify-bubu-aqua
      params:
        - name: app-path
          value: $(params.app-path)
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: build-image
      runAfter:
        - verify
      taskRef:
        name: build-image-bubu-aqua
      params:
        - name: image
          value: $(params.image)
        - name: dockerfile
          value: $(params.dockerfile)
        - name: build-context
          value: $(params.build-context)
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: update-gitops
      runAfter:
        - build-image
      taskRef:
        name: update-gitops
      params:
        - name: git-revision
          value: $(params.git-revision)
        - name: gitops-repo-url
          value: https://github.com/manfredbujok/cicd-bubu-aqua.git
        - name: deployment-file
          value: $(params.deployment-file)
        - name: image
          value: $(params.image-repository)