apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: bubu-aqua-template
  namespace: cicd-bubu-aqua
spec:
  params:
    - name: repo-url
    - name: git-revision

  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: bubu-aqua-auto-
        namespace: cicd-bubu-aqua
      spec:
        pipelineRef:
          name: bubu-aqua-ci

        params:
          - name: repo-url
            value: $(tt.params.repo-url)

          - name: image
            value: registry.kube-system.svc:80/bubu-aqua:latest

        workspaces:
          - name: shared-workspace
            persistentVolumeClaim:
              claimName: bubu-aqua-workspace
